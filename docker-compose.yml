services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Development image: source is bind-mounted over it, Vite serves assets.
      # The production stages live in the same Dockerfile — see
      # docker-compose.prod.yml.
      target: base
    volumes:
      - .:/var/www/html
    # Database credentials live in .env only. Exported here they would be real
    # environment variables, which outrank phpunit.xml — the test suite would
    # then run against (and wipe) the development database.
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: cuttosize
      MYSQL_USER: cuttosize
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    ports:
      - "5174:5174"
    volumes:
      - .:/var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  mysql-data:
